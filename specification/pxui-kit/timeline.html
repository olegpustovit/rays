<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>10 Timeline panel</title>
<link rel="stylesheet" href="kit.css">
<style>@font-face{font-family:'Pragmasevka';src:url(../../pxui/assets/fonts/Pragmasevka-Regular.ttf) format('truetype')}body{margin:0}</style>
</head><body>
<div class="sheet" style="width:1200px;height:97px;display:flex;flex-direction:column">
  <div class="phead"><span class="grip"></span><span class="chip line">Timeline</span><span class="dim">fixed dt 1/60</span><span class="grow"></span><button class="btn icon bare" aria-label="Collapse panel"><span class="chev l"></span></button></div>
  <div class="bar">
    <button class="btn on"><span style="width:0;height:0;border-left:7px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent"></span>Play<span class="key">Space p</span></button>
    <button class="btn"><span class="sq"></span>Stop</button>
    <button class="btn">Reset</button>
    <div style="width:1px;height:12px;background:var(--line-3);margin:0 4px"></div>
    <span class="cap">Frame</span><div class="field num" style="width:64px">48</div>
    <span class="cap">Time</span><span>0.80 s</span>
    <span class="grow"></span>
    <span class="cap">End</span><div class="field num" style="width:64px">100</div>
  </div>
  <div class="hsep"></div>
  <div style="position:relative;height:48px;background:var(--input);overflow:hidden">
    <div style="position:absolute;left:0;top:0;bottom:0;width:576px;background:var(--tint)"></div>
    <div style="position:absolute;left:0;right:0;bottom:0;height:6px;background:repeating-linear-gradient(90deg,var(--line-2) 0 1px,transparent 1px 12px)"></div>
    <div style="position:absolute;left:0;right:0;bottom:0;height:14px;background:repeating-linear-gradient(90deg,var(--line-3) 0 1px,transparent 1px 120px)"></div>
    <span class="idx" style="position:absolute;left:4px;top:16px">0</span>
    <span class="idx" style="position:absolute;left:124px;top:16px">10</span>
    <span class="idx" style="position:absolute;left:244px;top:16px">20</span>
    <span class="idx" style="position:absolute;left:364px;top:16px">30</span>
    <span class="idx" style="position:absolute;left:484px;top:16px">40</span>
    <span class="idx" style="position:absolute;left:604px;top:16px">50</span>
    <span class="idx" style="position:absolute;left:724px;top:16px">60</span>
    <span class="idx" style="position:absolute;left:844px;top:16px">70</span>
    <span class="idx" style="position:absolute;left:964px;top:16px">80</span>
    <span class="idx" style="position:absolute;left:1084px;top:16px">90</span>
    <div style="position:absolute;left:575px;top:0;bottom:0;width:2px;background:var(--accent)"></div>
    <span class="chip acc" style="position:absolute;left:577px;top:0">48</span>
  </div>
</div>
</body></html>
