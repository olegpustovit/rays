name: ci
on:
  push:
  pull_request:
env:
  CARGO_TERM_COLOR: never
jobs:
  macos:
    # Apple Silicon runners expose a Metal device: the GPU and window cases run here.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: brew install pkgconf sdl3
      - run: cargo check --workspace --tests --locked
      - run: cargo run -q -p gate -- deps
      # Known failures carried over from Rays (arena unsafe, lifetime structs in the engine): visible, not blocking, until the engine work lands.
      - run: cargo run -q -p gate -- shape
        continue-on-error: true
      - run: cargo t -p pxui_text -p pxui_render -p pxui -p ogpu_core -p ogpu_mock -p ogpu_metal -p pxui_sdl -p input -p cfmt
  windows:
    # The Windows runners have no Vulkan GPU: compile everything, run only what needs no device.
    # ogpu_vulkan, pxui_render and the pxui gpu_* targets are built here and exercised on a machine with a GPU.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - run: cargo check --workspace --tests --locked
      - run: cargo run -q -p gate -- deps
      # Known failures carried over from Rays (arena unsafe, lifetime structs in the engine): visible, not blocking, until the engine work lands.
      - run: cargo run -q -p gate -- shape
        continue-on-error: true
      - run: cargo t -p pxui_text -p ogpu_core -p ogpu_mock -p input -p cfmt
