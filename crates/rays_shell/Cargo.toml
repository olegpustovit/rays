[package]
name = "rays_shell"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "rays_shell"
path = "src/lib.rs"

[dependencies]
rays = { path = "../rays" }
rays_math = { path = "../rays_math" }
editor_core = { path = "../editor_core" }
pxui = { path = "../pxui" }
pxui_render = { path = "../pxui_render" }
ogpu_core = { path = "../ogpu_core" }
cfmt = { path = "../cfmt" }
input = { path = "../input" }
mem = { path = "../mem" }
param = { path = "../param" }

[dev-dependencies]
renderer = { path = "../renderer" }
sdl3 = { path = "../sdl3" }

# The kit text needs the SDL main thread (fonts): the window_ target runs its cases on its own main
# (the rays crate tests/common/window.rs) in one process.
[target.'cfg(windows)'.dev-dependencies]
ogpu_vulkan = { path = "../ogpu_vulkan" }

[target.'cfg(target_os = "macos")'.dev-dependencies]
ogpu_metal = { path = "../ogpu_metal" }

[[test]]
name = "window_rays_shell"
harness = false

[lints]
workspace = true
