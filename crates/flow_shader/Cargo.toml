name = "flow_shader"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "flow_shader"
path = "src/lib.rs"
test = false

[[bin]]
name = "print_shader"
path = "src/print_shader.rs"
test = false

[dependencies]
flow_syntax = { path = "../flow_syntax" }
flow_check = { path = "../flow_check" }
flow_eval = { path = "../flow_eval" }
flow_ir = { path = "../flow_ir" }
ogpu_core = { path = "../ogpu_core" }
rays_diagnostic = { path = "../rays_diagnostic" }
rays_math = { path = "../rays_math" }

[[test]]
name = "shader"
harness = false
