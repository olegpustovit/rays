[package]
autotests = false
name = "pxui_render"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "pxui_render"
path = "src/lib.rs"
test = false

[dependencies]
ogpu_core = { path = "../ogpu_core" }
pxui = { path = "../pxui" }

[dev-dependencies]
mem_sys = { path = "../mem_sys" }

[target.'cfg(any(windows, target_os = "linux"))'.dev-dependencies]
ogpu_vulkan = { path = "../ogpu_vulkan" }

[target.'cfg(target_os = "macos")'.dev-dependencies]
ogpu_metal = { path = "../ogpu_metal" }

[[test]]
name = "gpu_pxui_render"
harness = false

[lints]
workspace = true
