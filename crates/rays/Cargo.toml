[package]
name = "rays"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "rays"
path = "src/lib.rs"

[dependencies]
input = { path = "../../pxui/crates/open/input" }
scene_core = { path = "../scene_core" }
rays_math = { path = "../rays_math" }
lru = { path = "../lru" }
runtime_resources = { path = "../runtime_resources" }
runtime = { path = "../runtime" }
scene_command = { path = "../scene_command" }
renderer = { path = "../renderer" }
parallel = { path = "../parallel" }
mem = { path = "../mem" }
ogpu_core = { path = "../../pxui/crates/open/ogpu_core" }
cfmt = { path = "../../pxui/crates/open/cfmt" }
pxui = { path = "../../pxui/crates/public/pxui" }

[target.'cfg(any(windows, target_os = "linux"))'.dev-dependencies]
ogpu_vulkan = { path = "../../pxui/crates/open/ogpu_vulkan" }

[target.'cfg(target_os = "macos")'.dev-dependencies]
ogpu_metal = { path = "../../pxui/crates/open/ogpu_metal" }

# Resource operations need the SDL main thread, which libtest never gives a test: these targets'
# own main runs their cases (tests/common/window.rs) in one process on one device each; gpu_*
# targets are offscreen and run in parallel, window_* targets open windows (or only need the
# main thread) and run alone.

[[test]]
name = "gpu_rays_all"
harness = false

[[test]]
name = "window_rays_resources"
harness = false

[[test]]
name = "window_rays_sketch"
harness = false

[lints]
workspace = true
