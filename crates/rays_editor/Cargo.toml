[package]
name = "rays_editor"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
test-hooks = []

[lib]
name = "rays_editor"
path = "src/lib.rs"

[dependencies]
editor_document = { path = "../editor_document" }
flow_native = { path = "../flow_native" }
rays = { path = "../rays" }
rays_math = { path = "../rays_math" }
input = { path = "../input" }
runtime_input = { path = "../runtime_input" }
sdl3 = { path = "../sdl3" }
rdk_rays = { path = "../rdk_rays" }
rays_pathtracer = { path = "../rays_pathtracer" }
sop = { path = "../sop" }
flow_syntax = { path = "../flow_syntax" }
flow_check = { path = "../flow_check" }
flow_eval = { path = "../flow_eval" }
flow_sop = { path = "../flow_sop" }
flow_graph = { path = "../flow_graph" }
editor_core = { path = "../editor_core" }
pxui = { path = "../pxui" }
pxui_shell = { path = "../pxui_shell" }
pxui_graph = { path = "../pxui_graph" }
lru = { path = "../lru" }
cfmt = { path = "../cfmt" }
parallel = { path = "../parallel" }
flow_ir = { path = "../flow_ir" }
rdk = { path = "../rdk" }
rays_diagnostic = { path = "../rays_diagnostic" }
param = { path = "../param" }
mem = { path = "../mem" }
flow_gpu = { path = "../flow_gpu" }

[dev-dependencies]
ogpu = { path = "../ogpu" }
renderer = { path = "../renderer" }
flow_sop = { path = "../flow_sop", features = ["test-support"] }
runtime_resources = { path = "../runtime_resources" }
mem_sys = { path = "../mem_sys" }
scene_command = { path = "../scene_command" }

# Window/GPU suites (see rs/port/rays_editor_plan.md) are added per bundle, each
#   [[test]] name = "window_editor_<x>" / "gpu_editor_<x>"  harness = false
# like crates/pxui (own main, rays/tests/common/window.rs runner).

[target.'cfg(windows)'.dev-dependencies]
ogpu_vulkan = { path = "../ogpu_vulkan" }

[target.'cfg(target_os = "macos")'.dev-dependencies]
ogpu_metal = { path = "../ogpu_metal" }

[[test]]
name = "window_editor_smoke"
harness = false
required-features = ["test-hooks"]



[[test]]
name = "gpu_suite_t1"
path = "tests/gpu_suite_t1.rs"
harness = false
required-features = ["test-hooks"]

[[test]]
name = "gpu_suite_t2"
path = "tests/gpu_suite_t2.rs"
harness = false
required-features = ["test-hooks"]

[[test]]
name = "gpu_suite_t3"
path = "tests/gpu_suite_t3.rs"
harness = false
required-features = ["test-hooks"]

[[test]]
name = "gpu_suite_t4"
harness = false
required-features = ["test-hooks"]

[[test]]
name = "gpu_suite_t5"
harness = false
required-features = ["test-hooks"]

[[test]]
name = "gpu_suite_t6"
harness = false
required-features = ["test-hooks"]

[[test]]
name = "gpu_native_qualification"
harness = false
required-features = ["test-hooks"]
