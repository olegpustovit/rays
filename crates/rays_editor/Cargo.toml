[package]
name = "rays_editor"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "rays_editor"
path = "src/lib.rs"

[dependencies]
editor_document = { path = "../editor_document" }
flow_native = { path = "../flow_native" }
rays = { path = "../rays" }
rays_math = { path = "../rays_math" }
input = { path = "../../pxui/crates/open/input" }
runtime = { path = "../runtime" }
sdl3 = { path = "../../pxui/crates/open/sdl3" }
rdk_rays = { path = "../rdk_rays" }
rays_pathtracer = { path = "../rays_pathtracer" }
sop = { path = "../sop" }
flow_syntax = { path = "../flow_syntax" }
flow_check = { path = "../flow_check" }
flow_eval = { path = "../flow_eval" }
flow_sop = { path = "../flow_sop" }
flow_graph = { path = "../flow_graph" }
editor_core = { path = "../editor_core" }
pxui = { path = "../../pxui/crates/public/pxui", features = ["static"] }
rays_shell = { path = "../rays_shell" }
rays_graph = { path = "../rays_graph" }
lru = { path = "../lru" }
cfmt = { path = "../../pxui/crates/open/cfmt" }
parallel = { path = "../parallel" }
flow_ir = { path = "../flow_ir" }
rdk_core = { path = "../rdk_core" }
rays_diagnostic = { path = "../rays_diagnostic" }
param = { path = "../param" }
mem = { path = "../mem" }
flow_gpu = { path = "../flow_gpu" }

[dev-dependencies]
flow_shader = { path = "../flow_shader" }
rdk_ops = { path = "../rdk_ops" }
ogpu_core = { path = "../../pxui/crates/open/ogpu_core" }
renderer = { path = "../renderer" }
runtime_resources = { path = "../runtime_resources" }
mem_sys = { path = "../../pxui/crates/open/mem_sys" }
scene_command = { path = "../scene_command" }

# Window smoke + merged editor suite (B3), split: `gpu_editor` (device cases, serialized) and `editor` (pure, parallel); harness = false, rays/tests/common/window.rs.

[target.'cfg(any(windows, target_os = "linux"))'.dev-dependencies]
ogpu_vulkan = { path = "../../pxui/crates/open/ogpu_vulkan" }

[target.'cfg(target_os = "macos")'.dev-dependencies]
ogpu_metal = { path = "../../pxui/crates/open/ogpu_metal" }

[[test]]
name = "window_editor_smoke"
harness = false

[[test]]
name = "editor"
path = "tests/editor.rs"
harness = false

[[test]]
name = "gpu_editor"
path = "tests/gpu_editor.rs"
harness = false

[lints]
workspace = true

[[test]]
name = "window_rays_graph"
path = "../rays_graph/tests/window_rays_graph.rs"
harness = false

[[test]]
name = "gpu_flow_integration"
harness = false
