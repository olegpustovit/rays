[package]
name = "rays_bin"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "rays_bin"
path = "src/lib.rs"
test = false
doctest = false

[[bin]]
name = "rays"
path = "src/main.rs"
test = false

[dependencies]
editor_document = { path = "../editor_document" }
rays_editor = { path = "../rays_editor" }
web_export = { path = "../web_export" }
flow_syntax = { path = "../flow_syntax" }
flow_check = { path = "../flow_check" }
flow_eval = { path = "../flow_eval" }
flow_sop = { path = "../flow_sop" }
sop = { path = "../sop" }
mem = { path = "../mem" }
runtime = { path = "../runtime" }
sdl3 = { path = "../sdl3" }
rays_diagnostic = { path = "../rays_diagnostic" }
ogpu_core = { path = "../ogpu_core" }

[target.'cfg(windows)'.dependencies]
ogpu_vulkan = { path = "../ogpu_vulkan" }

[target.'cfg(target_os = "macos")'.dependencies]
ogpu_metal = { path = "../ogpu_metal" }

[lints]
workspace = true
