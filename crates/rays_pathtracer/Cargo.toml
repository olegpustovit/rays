[package]
autotests = false
name = "rays_pathtracer"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "rays_pathtracer"
path = "src/lib.rs"
test = false

[dependencies]
rays = { path = "../rays" }
ogpu_core = { path = "../../pxui/crates/ogpu_core" }
renderer = { path = "../renderer" }
runtime_resources = { path = "../runtime_resources" }
rays_math = { path = "../rays_math" }
flow_syntax = { path = "../flow_syntax" }
flow_check = { path = "../flow_check" }
flow_eval = { path = "../flow_eval" }
flow_ir = { path = "../flow_ir" }
flow_gpu = { path = "../flow_gpu" }
flow_shader = { path = "../flow_shader" }
input = { path = "../../pxui/crates/input" }
rays_diagnostic = { path = "../rays_diagnostic" }
cfmt = { path = "../../pxui/crates/cfmt" }
param = { path = "../param" }

[dev-dependencies]
runtime = { path = "../runtime" }

[target.'cfg(any(windows, target_os = "linux"))'.dev-dependencies]
ogpu_vulkan = { path = "../../pxui/crates/ogpu_vulkan" }

[target.'cfg(target_os = "macos")'.dev-dependencies]
ogpu_metal = { path = "../../pxui/crates/ogpu_metal" }

[[test]]
name = "gpu_all"
harness = false

[lints]
workspace = true
