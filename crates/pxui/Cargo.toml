[package]
autotests = false
name = "pxui"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "pxui"
path = "src/lib.rs"
test = false

[dependencies]
cfmt = { path = "../cfmt" }
input = { path = "../input" }
pxui_text = { path = "../pxui_text" }

# Headless: the UI, pxui_text and pxui_render's painter drawing into an offscreen texture. No SDL,
# no window, nothing from Rays (the Rays glue is tested in rays_shell).
[dev-dependencies]
pxui_render = { path = "../pxui_render" }
ogpu_core = { path = "../ogpu_core" }
mem_sys = { path = "../mem_sys" }

[target.'cfg(any(windows, target_os = "linux"))'.dev-dependencies]
ogpu_vulkan = { path = "../ogpu_vulkan" }

[target.'cfg(target_os = "macos")'.dev-dependencies]
ogpu_metal = { path = "../ogpu_metal" }

[[test]]
name = "pxui_all"
harness = false

[[test]]
name = "gpu_pxui_parity"
harness = false

[lints]
workspace = true
