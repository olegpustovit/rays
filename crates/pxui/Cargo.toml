[package]
autotests = false
name = "pxui"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "pxui"
path = "src/lib.rs"
test = false

[dependencies]
cfmt = { path = "../cfmt" }
input = { path = "../input" }
pxui_text = { path = "../pxui_text" }

# ponytail: the window cases run on the Rays host (fonts, clipboard, scene lowering) until
# pxui_text and pxui_render make them headless (P2-P4).
[dev-dependencies]
rays = { path = "../rays" }
rays_math = { path = "../rays_math" }
param = { path = "../param" }
mem = { path = "../mem" }
rays_shell = { path = "../rays_shell" }
rays_graph = { path = "../rays_graph" }
ogpu_core = { path = "../ogpu_core" }
renderer = { path = "../renderer" }
sdl3 = { path = "../sdl3" }
mem_sys = { path = "../mem_sys" }

# The kit text needs the SDL main thread (fonts), and the parity cases a Vulkan device: these
# targets run their cases on their own main (the rays crate tests/common/window.rs) in one process.
# gpu_* targets are offscreen and run in parallel, window_* targets run alone.

[target.'cfg(windows)'.dev-dependencies]
ogpu_vulkan = { path = "../ogpu_vulkan" }

[target.'cfg(target_os = "macos")'.dev-dependencies]
ogpu_metal = { path = "../ogpu_metal" }

[[test]]
name = "window_all"
harness = false

[[test]]
name = "window_parity"
harness = false

[lints]
workspace = true
