[package]
name = "pxui"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "pxui"
path = "src/lib.rs"

[dependencies]
rays = { path = "../rays" }
rays_math = { path = "../rays_math" }
param = { path = "../param" }
mem = { path = "../mem" }
cfmt = { path = "../cfmt" }
input = { path = "../input" }
scene_command = { path = "../scene_command" }

[dev-dependencies]
ogpu = { path = "../ogpu" }
renderer = { path = "../renderer" }
sdl3 = { path = "../sdl3" }

# The kit text needs the SDL main thread (fonts), and the parity cases a Vulkan device: these
# targets run their cases on their own main (the rays crate tests/common/window.rs) in one process.
# gpu_* targets are offscreen and run in parallel, window_* targets run alone.

[target.'cfg(windows)'.dev-dependencies]
ogpu_vulkan = { path = "../ogpu_vulkan" }

[target.'cfg(target_os = "macos")'.dev-dependencies]
ogpu_metal = { path = "../ogpu_metal" }

[[test]]
name = "gpu_pxui_parity"
harness = false

[[test]]
name = "window_pxui_ui"
harness = false
