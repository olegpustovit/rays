[package]
name = "sdl3"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
native_layer_token_sys = { path = "../native_layer_token_sys" }
sdl3_sys = { path = "../sdl3_sys" }

[features]
image = ["sdl3_sys/image"]
mixer = ["sdl3_sys/mixer"]
ttf = ["sdl3_sys/ttf"]

[dev-dependencies]
sdl3_sys = { path = "../sdl3_sys", features = ["test-util"] }

[lints]
workspace = true

[[test]]
name = "window_sdl3"
path = "tests/window_sdl3.rs"
harness = false
