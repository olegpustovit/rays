[package]
autotests = false
name = "renderer"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "renderer"
path = "src/lib.rs"

[dependencies]
ogpu_core = { path = "../../pxui/crates/open/ogpu_core" }
scene_command = { path = "../scene_command" }
runtime = { path = "../runtime" }
runtime_resources = { path = "../runtime_resources" }
lru = { path = "../lru" }
scene_core = { path = "../scene_core" }
rays_math = { path = "../rays_math" }
mem = { path = "../mem" }
cfmt = { path = "../../pxui/crates/open/cfmt" }

[dev-dependencies]
ogpu_mock = { path = "../../pxui/crates/open/ogpu_mock" }
mem_sys = { path = "../../pxui/crates/open/mem_sys" }

[target.'cfg(any(windows, target_os = "linux"))'.dev-dependencies]
ogpu_vulkan = { path = "../../pxui/crates/open/ogpu_vulkan" }

[target.'cfg(target_os = "macos")'.dev-dependencies]
ogpu_metal = { path = "../../pxui/crates/open/ogpu_metal" }

[[test]]
name = "gpu_all"
harness = false

[lints]
workspace = true
