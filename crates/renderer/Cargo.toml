[package]
name = "renderer"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "renderer"
path = "src/lib.rs"

[dependencies]
ogpu = { path = "../ogpu" }
scene_command = { path = "../scene_command" }
runtime = { path = "../runtime" }
runtime_resources = { path = "../runtime_resources" }
lru = { path = "../lru" }
rays_math = { path = "../rays_math" }
mem = { path = "../mem" }
cfmt = { path = "../cfmt" }

[dev-dependencies]
runtime_input = { path = "../runtime_input" }
ogpu_mock = { path = "../ogpu_mock" }
mem_sys = { path = "../mem_sys" }

[target.'cfg(windows)'.dev-dependencies]
ogpu_vulkan = { path = "../ogpu_vulkan" }

[target.'cfg(target_os = "macos")'.dev-dependencies]
ogpu_metal = { path = "../ogpu_metal" }

# Resource operations (and so Renderer.destroy) need the SDL main thread, which libtest never gives a
# test: these targets' own main runs their cases (tests/common/window.rs) in one process on one device
# each; the gpu_* targets are offscreen and run in parallel, window_all opens windows and runs alone.

[[test]]
name = "gpu_marks_1x"
harness = false

[[test]]
name = "gpu_marks_2x"
harness = false

[[test]]
name = "gpu_offscreen_etc"
harness = false

[[test]]
name = "gpu_scene_etc"
harness = false

[[test]]
name = "window_all"
harness = false

