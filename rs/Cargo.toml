[workspace]
resolver = "2"
members = ["crates/*", "tools/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.99"

[profile.dev]
opt-level = 0   # measured: opt-level=1 on flow_*/rdk_* gave no test-time gain (flow_eval 83 tests 19.4 s CPU either way, rdk_ops 260 tests ~25 s either way) and cost 2.5-3.5x cold build; see port/build-speed.md
debug = 0   # measured: cold build -20%, target dir -40%; panic locations still print (RUST_BACKTRACE lines need debug="line-tables-only")
incremental = true
codegen-units = 256
overflow-checks = true

# the global allocator's counters run on every allocation: unoptimised they were ~15% of debug lowering
[profile.dev.package.mem_sys]
opt-level = 3

[profile.release]
codegen-units = 16
lto = "thin"
debug = "line-tables-only"

[profile.e2e]
inherits = "dev"

[profile.gpu]
inherits = "dev"

[profile.slow]
inherits = "dev"
