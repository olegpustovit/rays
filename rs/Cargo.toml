[workspace]
resolver = "2"
members = ["crates/*", "tools/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.99"

[profile.dev]
opt-level = 0
debug = "line-tables-only"
incremental = true
codegen-units = 256
overflow-checks = true

# geometry kernels are too slow for tests at -O0
[profile.dev.package.rdk_geom]
opt-level = 1
[profile.dev.package.rdk_ops]
opt-level = 1

[profile.release]
codegen-units = 16
lto = "thin"
debug = "line-tables-only"

[profile.e2e]
inherits = "dev"

[profile.gpu]
inherits = "dev"

[profile.slow]
inherits = "dev"
