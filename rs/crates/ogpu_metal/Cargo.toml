[package]
name = "ogpu_metal"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "ogpu_metal"
path = "src/lib.rs"

# ponytail: no `lru` dependency; metal handles are not Send, so the 64 depth-stencil states are a small local LRU.
[dependencies]
ogpu_core = { path = "../ogpu_core" }
ogpu = { path = "../ogpu" }
metal = { path = "../metal" }

# Metal handles are main-thread only and the tests count process-wide handles: their own main runs them.
[[test]]
name = "gpu_ogpu_metal"
path = "tests/gpu_ogpu_metal.rs"
harness = false

[[test]]
name = "gpu_ogpu_metal_native"
path = "tests/gpu_ogpu_metal_native.rs"
harness = false
