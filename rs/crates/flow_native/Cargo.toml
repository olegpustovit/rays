[package]
name = "flow_native"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "flow_native"
path = "src/lib.rs"

[dependencies]
editor_document = { path = "../editor_document" }
rays = { path = "../rays" }
rays_math = { path = "../rays_math" }
input = { path = "../input" }
rdk = { path = "../rdk" }
flow_syntax = { path = "../flow_syntax" }
flow_check = { path = "../flow_check" }
flow_eval = { path = "../flow_eval" }
flow_graph = { path = "../flow_graph" }
flow_ir = { path = "../flow_ir" }
flow_shader = { path = "../flow_shader" }
flow_gpu = { path = "../flow_gpu" }
flow_sop = { path = "../flow_sop" }
scene_command = { path = "../scene_command" }
renderer = { path = "../renderer" }
ogpu = { path = "../ogpu" }
ogpu_core = { path = "../ogpu_core" }
runtime_resources = { path = "../runtime_resources" }
parallel = { path = "../parallel" }
sop = { path = "../sop" }
param = { path = "../param" }
mem = { path = "../mem" }
rays_diagnostic = { path = "../rays_diagnostic" }

[dev-dependencies]
ogpu_mock = { path = "../ogpu_mock" }
rdk_core = { path = "../rdk_core" }
flow_ir = { path = "../flow_ir" }

[target.'cfg(windows)'.dev-dependencies]
ogpu_vulkan = { path = "../ogpu_vulkan" }

[target.'cfg(target_os = "macos")'.dev-dependencies]
ogpu_metal = { path = "../ogpu_metal" }

[dev-dependencies.web_export]
path = "../web_export"

[dev-dependencies.mem_sys]
path = "../mem_sys"

# libtest never gives a test the process main thread, which SDL-backed resource operations need:
# this target runs from its own main (tests/common/window.rs), one device per process, Vulkan
# validation fatal.
[[test]]
name = "gpu_frame_alloc"
harness = false

[[test]]
name = "gpu_workspace_images"
harness = false
