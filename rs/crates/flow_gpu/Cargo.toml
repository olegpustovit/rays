[package]
name = "flow_gpu"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "flow_gpu"
path = "src/lib.rs"

[dependencies]
flow_syntax = { path = "../flow_syntax" }
flow_check = { path = "../flow_check" }
flow_eval = { path = "../flow_eval" }
flow_ir = { path = "../flow_ir" }
flow_shader = { path = "../flow_shader" }
ogpu_core = { path = "../ogpu_core" }
ogpu = { path = "../ogpu" }
renderer = { path = "../renderer" }
lru = { path = "../lru" }
mem = { path = "../mem" }
parallel = { path = "../parallel" }
param = { path = "../param" }
rays_math = { path = "../rays_math" }
cfmt = { path = "../cfmt" }
input = { path = "../input" }
rays_diagnostic = { path = "../rays_diagnostic" }

[dev-dependencies]
ogpu_mock = { path = "../ogpu_mock" }
flow_sop = { path = "../flow_sop" }
rdk = { path = "../rdk" }
rdk_core = { path = "../rdk_core" }
flow_graph = { path = "../flow_graph" }
sop = { path = "../sop" }

[target.'cfg(windows)'.dev-dependencies]
ogpu_vulkan = { path = "../ogpu_vulkan" }

[target.'cfg(target_os = "macos")'.dev-dependencies]
ogpu_metal = { path = "../ogpu_metal" }

# libtest never gives a test the process main thread, which SDL-backed resource operations need:
# these targets run their cases from their own main (tests/common/window.rs), one device per
# process, Vulkan validation fatal; `cargo t` runs the gpu_* targets in parallel.
[[test]]
name = "gpu_trace"
harness = false

[[test]]
name = "gpu_run"
harness = false

[[test]]
name = "gpu_triangles"
harness = false

[[test]]
name = "gpu_uint32"
harness = false

[[test]]
name = "gpu_pathtrace"
harness = false
